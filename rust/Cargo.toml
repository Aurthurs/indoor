# ============================================================
# workspace 根配置
# ============================================================
[workspace]

# 使用新版（v2）依赖解析器，避免统一 feature 合并带来的问题
resolver = "2"

# workspace 成员：自动包含 crates 目录下的所有子 crate
# 新增 crate 只需在 crates/ 下创建目录即可，无需修改此处
members = [
    "crates/*",
]

# ============================================================
# workspace 级别共享元数据
# 各子 crate 通过 `version.workspace = true` 等方式继承
# ============================================================
[workspace.package]
version = "0.1.0"
edition = "2021"      # Rust 2021 版
license = "MIT"

# ============================================================
# workspace 级别共享依赖
# 在此处声明版本，子 crate 只需写 `dep_name.workspace = true`
# ============================================================
[workspace.dependencies]
ferris-says = "0.3.1"         # ASCII 艺术文本输出
calamine = "0.26"             # Excel 文件读取
rust_xlsxwriter = "0.79"      # Excel 文件写入
